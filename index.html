<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<!--
  Everything this page is allowed to do.

  connect-src 'self'  lets it fetch payload.json from this same static host and nothing
                      else. There is no server here to receive data, so even a script
                      injected into this page has nowhere to send what it reads.
  default-src 'none'  nothing else loads at all: no third-party script, font, or tracking
                      pixel, and so no third party ever learns that someone opened this.
  'unsafe-inline'     the decrypted dashboard is one self-contained file whose script and
                      style are inline. It is the reason the directives around it are as
                      tight as they are.

  frame-ancestors cannot be enforced from a meta tag and GitHub Pages cannot send headers,
  so the script below refuses to run inside a frame instead.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self' data:;
  connect-src 'self';
  form-action 'none';
  base-uri 'none';">
<title>Protected report</title>
<style>
:root{color-scheme:light dark;
  --bg:#f3f5f8; --surface:#fff; --ink:#0f1a2a; --ink-2:#465164; --muted:#667183;
  --border:rgba(15,26,42,.14); --accent:#1c5cab; --accent-ink:#fff; --bad:#c52f2f}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1118; --surface:#151b24; --ink:#eef2f7; --ink-2:#b4bdca; --muted:#8490a1;
  --border:rgba(238,242,247,.12); --accent:#6da7ec; --accent-ink:#0c1118; --bad:#e66767}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;
  background:var(--bg);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:26px 24px 22px}
h1{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}
p{margin:0;color:var(--ink-2);font-size:13.5px}
label{display:block;margin:20px 0 6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
input{width:100%;font:inherit;padding:10px 12px;border-radius:9px;color:var(--ink);
  background:var(--bg);border:1px solid var(--border)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:10px 14px;
  border:1px solid var(--accent);border-radius:9px;background:var(--accent);
  color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
#msg{margin-top:12px;font-size:13px;min-height:1.4em}
#msg.err{color:var(--bad)}
#msg.work{color:var(--muted)}
#built{margin-top:2px;font-size:12px;color:var(--muted)}
footer{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);
  font-size:11.5px;line-height:1.5;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Protected report</h1>
  <p>This page holds an encrypted file. Enter the passphrase to unlock it in your browser.</p>

  <label for="pw">Passphrase</label>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="off"
         autocorrect="off" spellcheck="false" enterkeyhint="go">
  <button id="go" type="button">Unlock</button>
  <p id="msg" aria-live="polite"></p>
  <p id="built">Data last updated __BUILT__</p>

  <footer>
    Decryption happens here, on your device. The passphrase is never sent anywhere, and
    this page is not permitted to contact any server other than the one it came from.
  </footer>
</main>

<script>
(function(){
  "use strict";

  // No reason for this page to ever be embedded; refuse rather than be framed.
  if (window.top !== window.self) { document.body.textContent = "Blocked."; return; }

  var pw = document.getElementById("pw"),
      go = document.getElementById("go"),
      msg = document.getElementById("msg");

  function say(text, kind){ msg.textContent = text; msg.className = kind || ""; }

  function b64(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function gunzip(bytes){
    if (typeof DecompressionStream !== "function")
      throw new Error("This browser is too old to open the file. Try a current Chrome, Edge, Firefox or Safari.");
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }

  async function unlock(){
    var phrase = pw.value;
    if (!phrase) { say("Enter the passphrase.", "err"); pw.focus(); return; }

    go.disabled = true; pw.disabled = true;
    say("Unlocking…", "work");

    try {
      // GitHub Pages tells browsers and its CDN to hold files for ten minutes, so a
      // plain request can still return yesterday's data after a refresh has run. The
      // timestamp makes every request a new URL, which neither cache can answer from
      // its copy. "no-store" alone only covers the browser.
      var res = await fetch("payload.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("The encrypted file could not be loaded (" + res.status + ").");
      var p = await res.json();

      var key = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(phrase), "PBKDF2", false, ["deriveKey"]);
      var aes = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(p.kdf.salt),
          iterations: p.kdf.iterations, hash: p.kdf.hash },
        key, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

      var plain;
      try {
        plain = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64(p.cipher.iv) }, aes, b64(p.ct));
      } catch (e) {
        // AES-GCM authenticates: a wrong passphrase fails here and tells us nothing else.
        throw new Error("That passphrase does not open this file.");
      }

      var html = p.encoding === "gzip"
        ? await gunzip(new Uint8Array(plain))
        : new TextDecoder().decode(plain);

      // Replace this page with the decrypted one. The document keeps the Content-Security
      // Policy declared above, so the dashboard runs under the same restrictions.
      say("Opening…", "work");
      document.open();
      document.write(html);
      document.close();

    } catch (e) {
      say(e.message || "Could not unlock the file.", "err");
      go.disabled = false; pw.disabled = false;
      pw.select(); pw.focus();
    }
  }

  go.addEventListener("click", unlock);
  pw.addEventListener("keydown", function(e){ if (e.key === "Enter") unlock(); });
  pw.focus();
})();
</script>
</body>
</html>
